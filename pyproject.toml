[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-scanner"
version = "0.1.0"
description = "Find what your organisation exposes to the internet — subdomains, weak TLS, missing headers, leaked files — in one command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdimalik Salad Hussein" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asm-scan = "asm_scanner.cli:main"

[tool.setuptools]
packages = ["asm_scanner"]
